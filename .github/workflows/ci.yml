name: Artifact checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lock.txt
      # Short mode skips the M = 16384 windowed-sizing cases; run `make test` locally for the full suite.
      - run: make audit test smoke figures GOTESTFLAGS=-short
